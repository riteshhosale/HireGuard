services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jobguard-backend

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/jobguard_ai
      CORS_ORIGIN: http://localhost:5173

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - mongo

    restart: unless-stopped

  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    image: jobguard-scanner:latest
    profiles:
      - build

  mongo:
    image: mongo:7.0

    container_name: jobguard-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

volumes:
  mongo_data: